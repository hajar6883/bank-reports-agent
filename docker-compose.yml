services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bra
      POSTGRES_PASSWORD: bra
      POSTGRES_DB: bra
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bra"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
