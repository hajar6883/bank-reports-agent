name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bra
          POSTGRES_PASSWORD: bra
          POSTGRES_DB: bra_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bra"
          --health-interval 2s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://bra:bra@localhost:5433/bra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
